name: Validate railway system
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
        working-directory: frontend
      - run: npm test && npm run build
        working-directory: frontend
      - run: sh ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            target/surefire-reports
            target/site/jacoco
  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Build, test and package Windows application
        shell: pwsh
        run: ./scripts/build-desktop.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Ferrovia-Windows-x64
          path: |
            desktop/release/Ferrovia-Setup-*.exe
            desktop/release/*.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-verification
          path: |
            desktop/.smoke
            target/surefire-reports
