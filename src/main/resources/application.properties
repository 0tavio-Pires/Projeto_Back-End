spring.application.name=ferrovia
server.address=${RAIL_BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${RAIL_DB_URL:jdbc:h2:file:./data/ferrovia;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${RAIL_DB_USER:sa}
spring.datasource.password=${RAIL_DB_PASSWORD:}
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.error.include-message=never
server.error.include-stacktrace=never
spring.task.scheduling.pool.size=2
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
rail.scheduler.enabled=true
rail.scheduler.interval-ms=1000
rail.security.admin-password=${RAIL_ADMIN_PASSWORD:}
rail.security.operator-password=${RAIL_OPERATOR_PASSWORD:}
rail.security.viewer-password=${RAIL_VIEWER_PASSWORD:}
