# Only the Electron launcher provides the per-process credential and data directory.
rail.desktop.enabled=true
rail.desktop.token=${RAIL_DESKTOP_TOKEN:}
rail.desktop.watch-parent=true
server.address=127.0.0.1
server.port=0
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5s
spring.servlet.session.cookie.secure=false
spring.main.banner-mode=off
